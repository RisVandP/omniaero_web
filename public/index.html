<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniAero-Vision 智能巡检系统</title>
    <link rel="stylesheet" href="css/vehicle-theme.css">
    <link rel="stylesheet" href="css/mobile.css">
    <script src="js/vehicle-nav.js" defer></script>
</head>
<body data-page="home">
    <header class="vehicle-header"></header>

    <main class="vehicle-home vehicle-home-minimal">
        <section class="earth-stage" aria-label="系统运行态势">
            <div class="earth-wrap" aria-hidden="true">
                <div class="earth-glow"></div>
                <div class="earth">
                    <div class="earth-shine"></div>
                    <span class="continent continent-a"></span>
                    <span class="continent continent-b"></span>
                    <span class="continent continent-c"></span>
                    <span class="earth-point p1"></span>
                    <span class="earth-point p2"></span>
                    <span class="earth-point p3"></span>
                    <span class="earth-point p4"></span>
                    <span class="earth-point p5"></span>
                    <span class="earth-point p6"></span>
                </div>
                <div class="orbit orbit-a"></div>
                <div class="orbit orbit-b"></div>
                <div class="orbit orbit-c"></div>
            </div>

            <div class="earth-label label-air"><span></span>空域感知</div>
            <div class="earth-label label-ground"><span></span>地面处置</div>
            <div class="earth-label label-event"><span></span>事件闭环</div>

            <div class="system-status">
                <h1>当前系统工作正常</h1>
                <div class="status-strip">
                    <div class="status-cell"><span>空地链路</span><strong>正常</strong></div>
                    <div class="status-cell"><span>边缘 AI</span><strong>在线</strong></div>
                    <div class="status-cell"><span>智能驿站</span><strong>待命</strong></div>
                    <div class="status-cell"><span>安全等级</span><strong>低风险</strong></div>
                </div>
            </div>

            <div class="home-dashboard">
                <a class="home-stat-card" href="user.html">
                    <span>无人机工作 / 待机</span>
                    <strong>2 <em>/</em> 2</strong>
                    <small>架</small>
                </a>
                <a class="home-stat-card" href="map.html">
                    <span>GIS 调度事件</span>
                    <strong>3 <em>/</em> 17</strong>
                    <small>单</small>
                </a>
                <a class="home-stat-card" href="model.html">
                    <span>模型链路可用率</span>
                    <strong>98</strong>
                    <small>%</small>
                </a>
            </div>
        </section>
    </main>
    <script src="js/omni-spa.js"></script>
</body>
</html>
