<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天眼 GIS 指挥舱 - 交通管理者视角</title>
    <script src="js/theme-init.js"></script>
    <script src="https://webapi.amap.com/maps?v=2.0&key=8ec7b445354b6a716c53033aa17f5a65"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.1.1/model-viewer.min.js"></script>
    <link rel="stylesheet" href="css/map.css">
    <link rel="stylesheet" href="css/user.css">
    <link rel="stylesheet" href="css/agent.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/vehicle-theme.css">
    <link rel="stylesheet" href="css/mobile.css">
    <script src="js/vehicle-nav.js" defer></script>
</head>
<body data-page="gis">

    <header class="navbar">
        <div class="nav-left">
            <img src="image/logo.jpg" alt="Logo" onerror="this.src=''">
            <span>OmniAero-OBB</span>
        </div>
        <div class="nav-center">
            <div class="nav-tab" onclick="location.href='user.html'">无人机</div>
            <div class="nav-tab active" onclick="location.href='map.html'">天眼GIS</div>
            <div class="nav-tab" onclick="location.href='datacenter.html'">数据中心</div>
            <div class="nav-tab" onclick="location.href='model.html'">模型设置</div>
        </div>
        <div class="nav-right">
            <img src="image/avatar.png" alt="User Avatar" onerror="this.src=''">
        </div>
    </header>

    <div id="map"></div>


    <div class="map-audit-watermark">
        地图数据审图号：GS(2023)3206号 &nbsp;|&nbsp; © 2026 OmniAero-OBB 智能空天指挥系统
    </div>
    <div id="sys-toast" class="system-toast"></div>

    <div id="left-drawer" class="gemini-drawer left collapsed">
        <div class="drawer-header">
            <span id="left-drawer-title" class="drawer-title">标题</span>
            <button class="drawer-close-btn" onclick="closeDrawer('left')">×</button>
        </div>
        <div id="left-drawer-content" class="drawer-content"></div>
    </div>

    <div id="right-drawer" class="gemini-drawer right collapsed">
        <div class="drawer-header">
            <span id="right-drawer-title" class="drawer-title">详情</span>
            <button class="drawer-close-btn" onclick="closeDrawer('right')">×</button>
        </div>
        <div id="right-drawer-content" class="drawer-content"></div>
    </div>

    <div id="event-modal" class="gemini-modal collapsed">
        <div class="drawer-header">
            <span class="drawer-title">道路异常事件处理中心</span>
            <button class="drawer-close-btn" onclick="closeEventModal()">×</button>
        </div>
        <div id="event-modal-content" class="drawer-content" style="padding: 20px;"></div>
    </div>

    <div class="gemini-dock">
        <button class="dock-item" id="dock-btn-dispatch" onclick="openModule('dispatch')">
            <span class="dock-icon"></span> 巡逻派遣
        </button>
        <button class="dock-item" id="dock-btn-drone" onclick="openModule('drone')">
            <span class="dock-icon"></span> 无人机信息
        </button>
        <button class="dock-item" id="dock-btn-event" onclick="openModule('event')">
            <span class="dock-icon"></span> 事件处理
            <span id="event-badge" class="dock-badge">0</span>
        </button>
    </div>

    <div id="ai-agent-container" class="agent-container">
        <button id="agent-trigger-btn" class="agent-trigger-btn" onclick="toggleAgent()">
            <span class="arrow-icon">↑</span>
        </button>
        <div id="agent-chat-panel" class="agent-chat-panel collapsed">
            <div class="agent-input-wrapper">
                <input type="text" id="agent-input" placeholder="问问 Omni-Agent..." onkeypress="handleAgentInput(event)">
                <button class="agent-send-btn" onclick="sendAgentMsg()">↑</button>
                <button class="agent-minimize-btn" onclick="toggleAgent()">×</button>
            </div>
            <div class="agent-body" id="agent-chat-body"></div>
        </div>
    </div>

    <script src="js/agent-runtime.js"></script>
    <script src="js/map.js" defer></script>
    <script src="js/theme.js"></script>
    <script src="js/omni-spa.js"></script>
</body>
</html>
